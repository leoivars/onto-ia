stages:
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DJANGO_SETTINGS_MODULE: "config.settings"

cache:
  paths:
    - .cache/pip

test:
  stage: test
  image: python:3.13-slim
  before_script:
    - python -m pip install --quiet -r requirements.txt
  script:
    - python manage.py check
    - python manage.py makemigrations --check --dry-run
    - python manage.py test -v 2
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

deploy:
  stage: deploy
  image: alpine:3.20
  needs: ["test"]
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "cd /srv/onto && ./deploy/deploy.sh"
  environment:
    name: production
    url: https://onto.zx.com.ar
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: manual
