# Nginx para onto.zx.com.ar
# Certificado: Cloudflare Origin Certificate en /etc/ssl/onto/
# (o certbot con el registro en gris, ver DEPLOY.md)

server {
    listen 80;
    listen [::]:80;
    server_name onto.zx.com.ar;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25: agregar "http2 on;". En versiones previas: "listen 443 ssl http2;"
    server_name onto.zx.com.ar;

    ssl_certificate     /etc/ssl/onto/origin.pem;
    ssl_certificate_key /etc/ssl/onto/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 2m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    access_log /var/log/nginx/onto.access.log;
    error_log  /var/log/nginx/onto.error.log;

    # Estáticos: WhiteNoise también los sirve, pero nginx es más rápido.
    location /static/ {
        alias /srv/onto/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;   # la generación del informe puede tardar
        proxy_connect_timeout 10s;
    }
}
